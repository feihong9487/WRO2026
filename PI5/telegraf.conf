# 智慧香爐 — Telegraf 設定
# 職責：訂閱 mosquitto 的兩個主題，寫入本地 InfluxDB（可加開雲端鏡像）
# 事件驅動接收（MQTT 到一筆收一筆），flush 每 2 秒批次寫入

[agent]
  interval = "1s"
  flush_interval = "2s"
  # 每個輸出各自的記憶體緩衝：斷線就地緩衝、回線續傳（降級階梯的實作）
  # sensor + decision 各 1 Hz ≈ 2 筆/秒 → 10 萬筆可撐約 13 小時
  metric_buffer_limit = 100000

# ── 輸入一：感測資料（ESP32-S3 → incense/sensor）──────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://host.docker.internal:1883"]
  topics = ["incense/sensor"]
  qos = 0
  data_format = "json"          # 數值欄位自動展開；null 自動略過
  name_override = "sensor"

# ── 輸入二：決策紀錄（pi_fsm.py → incense/decision）──────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://host.docker.internal:1883"]
  topics = ["incense/decision"]
  qos = 0
  data_format = "json"
  # 字串欄位要明列才會進資料庫（狀態機與模式）
  json_string_fields = ["state", "r4_mode", "action"]
  name_override = "decision"

# ── 輸出一：本地 InfluxDB（主體，面板讀這裡）──────────────────
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "incense-local-token"
  organization = "incense"
  bucket = "incense"

# ── 輸出二：雲端鏡像（選配）────────────────────────────────
# 申請 InfluxDB Cloud Serverless 免費帳號後：
#   1. 建 bucket「incense」、產生 API Token
#   2. 解除下面註解，URL/org 依你帳號頁面顯示填寫
#   3. docker compose restart telegraf
# 斷網時本區塊自動緩衝、回線續傳 —— 即「雲斷 → Pi 本地續跑」的證據
#
# [[outputs.influxdb_v2]]
#   urls = ["https://us-east-1-1.aws.cloud2.influxdata.com"]
#   token = "你的CloudToken"
#   organization = "你的CloudOrg（通常是註冊Email）"
#   bucket = "incense"
