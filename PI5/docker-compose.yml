# 智慧香爐監測平台 — InfluxDB + Telegraf + Grafana（Raspberry Pi 5 / arm64）
# 使用：與 telegraf.conf 放同一資料夾，執行 docker compose up -d
# 注意：以下帳密/Token 僅供自家區網實驗，正式部署前務必更改

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=incense
      - DOCKER_INFLUXDB_INIT_PASSWORD=incense12345
      - DOCKER_INFLUXDB_INIT_ORG=incense
      - DOCKER_INFLUXDB_INIT_BUCKET=incense
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=incense-local-token

  telegraf:
    image: telegraf:1.30
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      - influxdb
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    extra_hosts:
      # 讓容器連得到 Pi 主機上原生跑的 mosquitto（host.docker.internal:1883）
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=incense12345

volumes:
  influxdb-data:
  grafana-data:
