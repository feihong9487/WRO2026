# 智慧香爐 — 雲端中心站 mosquitto 設定
# 帳密驗證：先 touch passwd 啟動後，用 mosquitto_passwd 建立 burner 與 telegraf 兩個帳號
# （指令見《多爐平台指南》§1），再 docker compose restart mosquitto

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# 讓 QoS1 訊息與離線佇列落地，重啟不遺失
persistence true
persistence_location /mosquitto/data/

# 提高每個客戶端的離線佇列上限（搭配各爐橋接的 cleansession false）
max_queued_messages 100000
