# 智慧香爐 — 雲端中心站 Telegraf 設定
# 訂閱 incense/{爐號}/sensor 與 incense/{爐號}/decision，
# 從主題第二段解析出 device 標籤（Grafana 下拉選單與總覽面板靠它）。
# ★ 把兩處 password 改成你用 mosquitto_passwd 設定的 telegraf 密碼 ★

[agent]
  interval = "1s"
  flush_interval = "2s"
  metric_buffer_limit = 100000

# ── 感測資料（各爐 S3 → 橋接上雲）──────────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["incense/+/sensor"]
  username = "telegraf"
  password = "改成你的telegraf密碼"
  qos = 1
  data_format = "json"
  name_override = "sensor"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "incense/+/sensor"
    tags = "_/device/_"

# ── 決策紀錄（各爐 pi_fsm → 橋接上雲）─────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["incense/+/decision"]
  username = "telegraf"
  password = "改成你的telegraf密碼"
  qos = 1
  data_format = "json"
  json_string_fields = ["state", "r4_mode", "action"]
  name_override = "decision"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "incense/+/decision"
    tags = "_/device/_"

# ── 寫入 InfluxDB ─────────────────────────────────────────
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "incense-local-token"
  organization = "incense"
  bucket = "incense"
